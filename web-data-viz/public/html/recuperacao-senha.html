<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | FlixView</title>
    <link rel="stylesheet" href="../css/login-cadastro.css">
</head>
<body>
    <header>
        <div class="logo"><a href="./index.html"><img src="../assets/imgs/Logo FlixView.png" alt="FlixView"></a></div>
    </header>
    <main>
        <div class="container">
            <div class="section-A"><img src="../assets/imgs/bannerLog.png" alt="" class="banner"></div>
            <div class="forms">
                <h1 class="titulo-recuperacao" id="titulo-pagina">Esqueceu sua senha?</h1>
                <section class="section-B">
                    <form class="container-entrar" id="form-recuperacao">
                        <label for="recuperacao_email" class="rotulo"> Informe o email de cadastro</label>
                        <input type="email" placeholder="voce@exemplo.com" class="info" id="recuperacao_email" autocomplete="email" required>
                        <div class="section-C">
                            <button class="singin" id="btn-solicitar" type="submit">Solicitar recuperação</button>
                            <a href="./login-cadastro.html" class="link">Voltar para o login</a>
                        </div>
                    </form>

                    <div class="reenvio-recuperacao" id="area-reenvio" hidden>
                        <button type="button" class="link reenvio-botao" id="btn-reenviar">Não recebeu o e-mail? Clique aqui para enviar novamente.</button>
                        <span class="descricao status-reenvio" id="status-reenvio" role="status" aria-live="polite"></span>
                    </div>

                    <form class="container-entrar" id="form-redefinicao" hidden>
                        <label for="nova_senha" class="rotulo">Nova senha</label>
                        <input type="password" class="info" id="nova_senha" autocomplete="new-password" minlength="5" maxlength="50" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{5,50}" title="Use de 5 a 50 caracteres, incluindo maiúscula, minúscula, número e caractere especial." required>
                        <label for="confirmar_nova_senha" class="rotulo">Confirme sua nova senha</label>
                        <input type="password" class="info" id="confirmar_nova_senha" autocomplete="new-password" minlength="5" maxlength="50" required>
                        <div class="section-C">
                            <button class="singin" type="submit">Confirmar</button>
                            <a href="./login-cadastro.html" class="link">Voltar para o login</a>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <div class="alerta-recuperacao" id="alerta" role="alert" aria-live="assertive" hidden>
        <span id="alerta-texto"></span>
        <button type="button" id="fechar-alerta" aria-label="Fechar alerta">&times;</button>
        <a href="./login-cadastro.html" id="link-login" hidden>Ir para o login</a>
    </div>
    <script src="../js/recuperacao-senha.js"></script>
</body>
</html>
